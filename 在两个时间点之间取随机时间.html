<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="./random_Time_2048x2048.png"> 
<link rel="icon" href="./random_Time_2048x2048.png"> 

<title>在两个时间点之间取随机时间</title>
<style>
    :root{
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2328;
        --muted: #6b7280;
        --border: #d0d7de;
        --primary: #2563eb;
        --primary-active: #1d4ed8;
        --error: #d1242f;
        --result-bg: #eef4ff;
    }
    @media (prefers-color-scheme: dark){
        :root{
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --muted: #9198a1;
            --border: #30363d;
            --primary: #3b82f6;
            --primary-active: #2563eb;
            --error: #f85149;
            --result-bg: #12233d;
        }
    }
    *{ box-sizing: border-box; }
    body{
        margin: 0;
        padding: 24px 16px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.5;
    }
    .card{
        width: 100%;
        max-width: 480px;
        margin-top: 24px;
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
    }
    h1{
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
    }
    .hint{
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
    }
    .field{
        margin-bottom: 16px;
    }
    .field-label{
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-size: 14px;
        color: var(--muted);
    }
    .fill-now{
        padding: 0;
        border: none;
        background: none;
        color: var(--primary);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
    }
    .fill-now:hover{ text-decoration: underline; }
    input[type="text"]{
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
    }
    input[type="text"]:focus{
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
    }
    input::placeholder{
        color: var(--muted);
        opacity: .7;
    }
    .actions{
        display: flex;
        gap: 8px;
        margin-top: 20px;
    }
    button.primary-button{
        flex: 1;
        padding: 11px 16px;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    button.primary-button:active{ background: var(--primary-active); }
    .message{
        min-height: 22px;
        margin: 16px 0 0;
        font-size: 14px;
        color: var(--error);
    }
    .result-panel{
        display: none;
        margin-top: 8px;
        padding: 16px;
        border-radius: 8px;
        background: var(--result-bg);
    }
    .result-panel.is-visible{ display: block; }
    .result-label{
        margin: 0 0 4px;
        font-size: 13px;
        color: var(--muted);
    }
    .result{
        margin: 0;
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
    }
    .range-info{
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>

<div class="card">
    <h1>在两个时间点之间取随机时间</h1>
    <p class="hint">直接输入开始时刻和结束时刻（不包含日期，精确到分钟），随机生成一个落在两者之间（含两端）的时间。若结束时间早于开始时间，按跨过午夜计算。</p>

    <div class="field">
        <div class="field-label">
            <label for="startTime">开始时间</label>
            <button class="fill-now" type="button" onclick="fillNow('startTime')">填入现在</button>
        </div>
        <input type="text" id="startTime" placeholder="例如 09:30" autocomplete="off">
    </div>

    <div class="field">
        <div class="field-label">
            <label for="endTime">结束时间</label>
            <button class="fill-now" type="button" onclick="fillNow('endTime')">填入现在</button>
        </div>
        <input type="text" id="endTime" placeholder="例如 11:00" autocomplete="off">
    </div>

    <div class="actions">
        <button class="primary-button" id="generateBtn" type="button" onclick="generateRandomTime()">生成随机时间</button>
    </div>

    <p class="message" id="message" aria-live="polite"></p>

    <div class="result-panel" id="resultPanel">
        <p class="result-label">随机时间</p>
        <p class="result" id="result">—</p>
        <p class="range-info" id="rangeInfo"></p>
    </div>
</div>

<script>
// 一天的分钟数
const MINUTES_PER_DAY = 24 * 60;

// ---------- 小工具 ----------

// 数字补零，如 5 -> "05"
function pad2(number) {
    return String(number).padStart(2, "0");
}

// 把“从午夜起的分钟数”格式化为 "HH:mm"
// 传入值不会为负，跨午夜时可能超过一天，取模即可
function formatClock(minutes) {
    const value = minutes % MINUTES_PER_DAY;
    return pad2(Math.floor(value / 60)) + ":" + pad2(value % 60);
}

// 解析手动输入的时间，返回从午夜起的分钟数，格式不对返回 NaN
// 支持 "9:30"、"09:30"、"09:30:15" 以及全角冒号；精确到分钟，秒会被舍去
function parseClock(text) {
    const normalized = text.trim().replace(/：/g, ":");
    const match = /^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/.exec(normalized);
    if (!match) return NaN;
    const hours = Number(match[1]);
    const minutes = Number(match[2]);
    const seconds = match[3] ? Number(match[3]) : 0;
    if (hours > 23 || minutes > 59 || seconds > 59) return NaN;
    return hours * 60 + minutes;
}

// 把当前时刻（只取时分）转成输入框格式 "HH:mm"
function currentClockText() {
    const now = new Date();
    return pad2(now.getHours()) + ":" + pad2(now.getMinutes());
}

// 把时长（分钟）表示为 "X 小时 X 分"
function formatDuration(minutes) {
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if (hours && mins) return hours + " 小时 " + mins + " 分";
    if (hours) return hours + " 小时";
    return mins + " 分钟";
}

// 返回 [0, maxExclusive) 之间的随机整数
// 优先使用 crypto 保证均匀分布，不支持时退回 Math.random
function randomInt(maxExclusive) {
    if (maxExclusive <= 0) return 0;

    if (window.crypto && crypto.getRandomValues && maxExclusive <= 4294967296) {
        const bucket = Math.floor(4294967296 / maxExclusive);
        const buffer = new Uint32Array(1);
        let value;
        // 落在末尾不完整的桶里就重新抽，避免取模偏差
        do {
            crypto.getRandomValues(buffer);
            value = buffer[0];
        } while (value >= bucket * maxExclusive);
        return value % maxExclusive;
    }

    return Math.floor(Math.random() * maxExclusive);
}

// ---------- 页面逻辑 ----------

const startInput = document.getElementById("startTime");
const endInput = document.getElementById("endTime");
const messageEl = document.getElementById("message");
const resultPanel = document.getElementById("resultPanel");
const resultEl = document.getElementById("result");
const rangeInfoEl = document.getElementById("rangeInfo");

// 点击“填入现在”时把当前时刻写进对应输入框
function fillNow(inputId) {
    document.getElementById(inputId).value = currentClockText();
    messageEl.textContent = "";
}

// 页面打开时给一组默认值：当前时刻（精确到分钟）到一小时后
function setDefaultValues() {
    if (startInput.value || endInput.value) return;
    const now = new Date();
    const currentMinute = now.getHours() * 60 + now.getMinutes();
    startInput.value = formatClock(currentMinute);
    endInput.value = formatClock(currentMinute + 60);
}

function showError(text) {
    messageEl.textContent = text;
    resultPanel.classList.remove("is-visible");
}

function generateRandomTime() {
    messageEl.textContent = "";

    if (startInput.value === "" || endInput.value === "") {
        showError("请先填写开始时间和结束时间。");
        return;
    }

    const startMinutes = parseClock(startInput.value);
    const endMinutes = parseClock(endInput.value);

    if (Number.isNaN(startMinutes) || Number.isNaN(endMinutes)) {
        showError("时间格式不正确，请按 09:30 的格式输入。");
        return;
    }

    // 结束早于开始 → 视为跨过午夜
    const crossesMidnight = endMinutes < startMinutes;
    const rangeEnd = crossesMidnight ? endMinutes + MINUTES_PER_DAY : endMinutes;

    // 在 [开始, 结束] 的整分钟上均匀抽取
    const randomMinutes = startMinutes === rangeEnd
        ? startMinutes
        : startMinutes + randomInt(rangeEnd - startMinutes + 1);

    resultEl.textContent = formatClock(randomMinutes);
    rangeInfoEl.textContent = "区间：" + formatClock(startMinutes) + " ～ " + formatClock(endMinutes)
        + (crossesMidnight ? "（跨午夜）" : "")
        + "（共 " + formatDuration(rangeEnd - startMinutes) + "）";
    resultPanel.classList.add("is-visible");
}

[startInput, endInput].forEach(function (input) {
    // 按回车直接生成
    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            generateRandomTime();
        }
    });

    // 输入框失去焦点时，把合法的简写整理成 HH:mm
    input.addEventListener("blur", function () {
        const minutes = parseClock(input.value);
        if (!Number.isNaN(minutes)) {
            input.value = formatClock(minutes);
        }
    });
});

setDefaultValues();
</script>

</body>
</html>
