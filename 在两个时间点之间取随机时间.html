<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在两个时间点之间取随机时间</title>
<style>
    :root{
        --背景: #f4f5f7;
        --卡片: #ffffff;
        --文字: #1f2328;
        --次要文字: #6b7280;
        --边框: #d0d7de;
        --主色: #2563eb;
        --主色按下: #1d4ed8;
        --错误: #d1242f;
        --结果背景: #eef4ff;
    }
    @media (prefers-color-scheme: dark){
        :root{
            --背景: #0d1117;
            --卡片: #161b22;
            --文字: #e6edf3;
            --次要文字: #9198a1;
            --边框: #30363d;
            --主色: #3b82f6;
            --主色按下: #2563eb;
            --错误: #f85149;
            --结果背景: #12233d;
        }
    }
    *{ box-sizing: border-box; }
    body{
        margin: 0;
        padding: 24px 16px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: var(--背景);
        color: var(--文字);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.5;
    }
    .卡片{
        width: 100%;
        max-width: 480px;
        margin-top: 24px;
        padding: 24px;
        background: var(--卡片);
        border: 1px solid var(--边框);
        border-radius: 12px;
    }
    h1{
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
    }
    .说明{
        margin: 0 0 20px;
        color: var(--次要文字);
        font-size: 14px;
    }
    .字段{
        margin-bottom: 16px;
    }
    .字段标题{
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-size: 14px;
        color: var(--次要文字);
    }
    .填入现在{
        padding: 0;
        border: none;
        background: none;
        color: var(--主色);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
    }
    .填入现在:hover{ text-decoration: underline; }
    input[type="text"]{
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--边框);
        border-radius: 8px;
        background: var(--卡片);
        color: var(--文字);
        font: inherit;
        font-variant-numeric: tabular-nums;
    }
    input[type="text"]:focus{
        outline: none;
        border-color: var(--主色);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
    }
    input::placeholder{
        color: var(--次要文字);
        opacity: .7;
    }
    .按钮行{
        display: flex;
        gap: 8px;
        margin-top: 20px;
    }
    button.主按钮, button.次按钮{
        flex: 1;
        padding: 11px 16px;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    button.主按钮{
        border: none;
        background: var(--主色);
        color: #fff;
    }
    button.主按钮:active{ background: var(--主色按下); }
    button.次按钮{
        border: 1px solid var(--边框);
        background: transparent;
        color: var(--文字);
    }
    button:disabled{
        opacity: .5;
        cursor: not-allowed;
    }
    .提示{
        min-height: 22px;
        margin: 16px 0 0;
        font-size: 14px;
        color: var(--错误);
    }
    .结果区{
        display: none;
        margin-top: 8px;
        padding: 16px;
        border-radius: 8px;
        background: var(--结果背景);
    }
    .结果区.显示{ display: block; }
    .结果标题{
        margin: 0 0 4px;
        font-size: 13px;
        color: var(--次要文字);
    }
    .结果{
        margin: 0;
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
    }
    .区间信息{
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--次要文字);
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>

<div class="卡片">
    <h1>在两个时间点之间取随机时间</h1>
    <p class="说明">直接输入开始时刻和结束时刻（不包含日期，精确到分钟），随机生成一个落在两者之间（含两端）的时间。若结束时间早于开始时间，按跨过午夜计算。</p>

    <div class="字段">
        <div class="字段标题">
            <label for="开始时间">开始时间</label>
            <button class="填入现在" type="button" onclick="填入现在('开始时间')">填入现在</button>
        </div>
        <input type="text" id="开始时间" placeholder="例如 09:30" autocomplete="off">
    </div>

    <div class="字段">
        <div class="字段标题">
            <label for="结束时间">结束时间</label>
            <button class="填入现在" type="button" onclick="填入现在('结束时间')">填入现在</button>
        </div>
        <input type="text" id="结束时间" placeholder="例如 11:00" autocomplete="off">
    </div>

    <div class="按钮行">
        <button class="主按钮" id="生成按钮" type="button" onclick="生成随机时间()">生成随机时间</button>
        <button class="次按钮" id="复制按钮" type="button" onclick="复制结果()" disabled>复制</button>
    </div>

    <p class="提示" id="提示" aria-live="polite"></p>

    <div class="结果区" id="结果区">
        <p class="结果标题">随机时间</p>
        <p class="结果" id="结果">—</p>
        <p class="区间信息" id="区间信息"></p>
    </div>
</div>

<script>
// 一天的分钟数
const 一天分钟 = 24 * 60;

// ---------- 小工具 ----------

// 数字补零，如 5 -> "05"
function 补零(数字) {
    return String(数字).padStart(2, "0");
}

// 把“从午夜起的分钟数”格式化为 "HH:mm"，支持跨午夜时超过一天的值
function 格式化时刻(分钟) {
    const 取值 = ((分钟 % 一天分钟) + 一天分钟) % 一天分钟;
    return 补零(Math.floor(取值 / 60)) + ":" + 补零(取值 % 60);
}

// 解析手动输入的时间，返回从午夜起的分钟数，格式不对返回 NaN
// 支持 "9:30"、"09:30"、"09:30:15" 以及全角冒号；精确到分钟，秒会被舍去
function 解析时刻(文本) {
    const 规整后 = 文本.trim().replace(/：/g, ":");
    const 匹配 = /^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/.exec(规整后);
    if (!匹配) return NaN;
    const 时 = Number(匹配[1]);
    const 分 = Number(匹配[2]);
    const 秒 = 匹配[3] ? Number(匹配[3]) : 0;
    if (时 > 23 || 分 > 59 || 秒 > 59) return NaN;
    return 时 * 60 + 分;
}

// 把当前时刻（只取时分）转成输入框格式 "HH:mm"
function 当前时刻文本() {
    const 现在 = new Date();
    return 补零(现在.getHours()) + ":" + 补零(现在.getMinutes());
}

// 把时长（分钟）表示为 "X 小时 X 分"
function 格式化时长(分钟) {
    const 时 = Math.floor(分钟 / 60);
    const 分 = 分钟 % 60;
    if (时 && 分) return 时 + " 小时 " + 分 + " 分";
    if (时) return 时 + " 小时";
    return 分 + " 分钟";
}

// 返回 [0, 最大值) 之间的随机整数
// 优先使用 crypto 保证均匀分布，不支持时退回 Math.random
function 随机整数(最大值) {
    if (最大值 <= 0) return 0;

    if (window.crypto && crypto.getRandomValues && 最大值 <= 4294967296) {
        const 桶 = Math.floor(4294967296 / 最大值);
        const 缓冲 = new Uint32Array(1);
        let 值;
        // 落在末尾不完整的桶里就重新抽，避免取模偏差
        do {
            crypto.getRandomValues(缓冲);
            值 = 缓冲[0];
        } while (值 >= 桶 * 最大值);
        return 值 % 最大值;
    }

    return Math.floor(Math.random() * 最大值);
}

// ---------- 页面逻辑 ----------

const 开始框 = document.getElementById("开始时间");
const 结束框 = document.getElementById("结束时间");
const 提示 = document.getElementById("提示");
const 结果区 = document.getElementById("结果区");
const 结果 = document.getElementById("结果");
const 区间信息 = document.getElementById("区间信息");
const 复制按钮 = document.getElementById("复制按钮");

// 点击“填入现在”时把当前时刻写进对应输入框
function 填入现在(输入框ID) {
    document.getElementById(输入框ID).value = 当前时刻文本();
    提示.textContent = "";
}

// 页面打开时给一组默认值：当前时刻（精确到分钟）到一小时后
function 设置默认值() {
    if (开始框.value || 结束框.value) return;
    const 现在 = new Date();
    const 当前分钟 = 现在.getHours() * 60 + 现在.getMinutes();
    开始框.value = 格式化时刻(当前分钟);
    结束框.value = 格式化时刻(当前分钟 + 60);
}

function 显示错误(文本) {
    提示.textContent = 文本;
    结果区.classList.remove("显示");
    复制按钮.disabled = true;
}

function 生成随机时间() {
    提示.textContent = "";

    if (开始框.value === "" || 结束框.value === "") {
        显示错误("请先填写开始时间和结束时间。");
        return;
    }

    const 开始分钟 = 解析时刻(开始框.value);
    const 结束分钟 = 解析时刻(结束框.value);

    if (Number.isNaN(开始分钟) || Number.isNaN(结束分钟)) {
        显示错误("时间格式不正确，请按 09:30 的格式输入。");
        return;
    }

    // 结束早于开始 → 视为跨过午夜
    const 跨午夜 = 结束分钟 < 开始分钟;
    const 区间结束 = 跨午夜 ? 结束分钟 + 一天分钟 : 结束分钟;

    // 在 [开始, 结束] 的整分钟上均匀抽取
    const 随机分钟 = 开始分钟 === 区间结束
        ? 开始分钟
        : 开始分钟 + 随机整数(区间结束 - 开始分钟 + 1);

    结果.textContent = 格式化时刻(随机分钟);
    区间信息.textContent = "区间：" + 格式化时刻(开始分钟) + " ～ " + 格式化时刻(结束分钟)
        + (跨午夜 ? "（跨午夜）" : "")
        + "（共 " + 格式化时长(区间结束 - 开始分钟) + "）";
    结果区.classList.add("显示");
    复制按钮.disabled = false;
}

async function 复制结果() {
    const 文本 = 结果.textContent;
    if (!文本 || 文本 === "—") return;

    try {
        await navigator.clipboard.writeText(文本);
    } catch (错误) {
        // 部分浏览器（如非安全上下文）不支持剪贴板 API，退回旧方法
        const 临时框 = document.createElement("textarea");
        临时框.value = 文本;
        临时框.style.position = "fixed";
        临时框.style.opacity = "0";
        document.body.appendChild(临时框);
        临时框.select();
        document.execCommand("copy");
        document.body.removeChild(临时框);
    }

    const 原文字 = 复制按钮.textContent;
    复制按钮.textContent = "已复制";
    setTimeout(function () {
        复制按钮.textContent = 原文字;
    }, 1200);
}

[开始框, 结束框].forEach(function (输入框) {
    // 按回车直接生成
    输入框.addEventListener("keydown", function (事件) {
        if (事件.key === "Enter") {
            事件.preventDefault();
            生成随机时间();
        }
    });

    // 输入框失去焦点时，把合法的简写整理成 HH:mm
    输入框.addEventListener("blur", function () {
        const 分钟 = 解析时刻(输入框.value);
        if (!Number.isNaN(分钟)) {
            输入框.value = 格式化时刻(分钟);
        }
    });
});

设置默认值();
</script>

</body>
</html>
